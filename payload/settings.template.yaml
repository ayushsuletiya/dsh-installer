#if OMNIROUTE_BASE_URL
    qwen-omni:
      displayName: Qwen · via OmniRoute (chat only · any machine)
      # CHAT ONLY, and this applies to the OmniRoute route ONLY — the local
      # desktop bridge below DOES do the full tool loop. OmniRoute's Qwen executor
      # folds the tool list into the prompt, so the model answers "Tool bash does
      # not exists" and asks the user to run commands by hand, and sending a tool
      # RESULT back returns HTTP 502 (reproduced 3/3, 1 Sep 2026). DSH has no
      # per-model "no tools" flag — PiAiModelProfile offers only
      # id/name/contextWindow/maxTokens/input/reasoningEfforts/compat — so the
      # group name is the only place this can be surfaced.
      apiKeyEnv: OMNIROUTER_API_KEY
      api: openai-completions
      baseURL: {{OMNIROUTE_BASE_URL}}
      # Same Qwen account, reached through the OmniRoute gateway instead of the
      # local app: a relay holds the web session (cookie + bx-ua signature) and
      # speaks OpenAI, registered in OmniRoute as a custom openai-compatible-chat
      # provider node — its id is QWEN_OMNI_NODE_ID in your secrets file. Works
      # from any machine and does not need the desktop app awake; a machine that
      # HAS the app can keep the signature fresh every 30 min via
      # run.sh -> push-creds.mjs (set QWEN_RELAY_SSH).
      # PREFIX MATTERS, and it changed: `qwen/qwen3.8-max` now resolves to
      # OpenRouter's PAID catalog and dies with "[402] requires more credits"
      # (verified 31 Aug 2026). The web session is only reachable through the
      # provider-node id below. All six ids answered on it. Tool calling is
      # prompt-emulated on this route, so keep it for chat and reasoning.
      models:
        - id: {{QWEN_OMNI_NODE_ID}}/qwen3.8-max
          name: Qwen3.8 Max · OmniRoute
          contextWindow: 1000000
          maxTokens: 65536
          input: [ text ]
          reasoningEfforts:
            "off":
            high: high
            max: max
        - id: {{QWEN_OMNI_NODE_ID}}/qwen3.7-plus
          name: Qwen3.7 Plus · OmniRoute
          contextWindow: 1000000
          maxTokens: 65536
          input: [ text ]
          reasoningEfforts:
            "off":
            high: high
            max: max
        - id: {{QWEN_OMNI_NODE_ID}}/qwen3.7-max
          name: Qwen3.7 Max · OmniRoute
          contextWindow: 1000000
          maxTokens: 65536
          input: [ text ]
          reasoningEfforts:
            "off":
            high: high
            max: max
        - id: {{QWEN_OMNI_NODE_ID}}/qwen3.5-omni-plus
