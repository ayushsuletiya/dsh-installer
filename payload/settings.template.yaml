    agentrouter:
      displayName: Others · AgentRouter
      apiKeyEnv: AGENTROUTER_API_KEY
      api: anthropic-messages
      baseURL: http://127.0.0.1:3081
      # AgentRouter is a plain HTTPS API — nothing here is machine-specific — but
      # it 401s ("unauthorized client detected") unless the request carries
      # `User-Agent: claude-cli/…`, and pi-ai's anthropic-messages client sets its
      # own User-Agent AFTER merging a provider `headers:` map. So pointing this
      # baseURL straight at https://agentrouter.org returns AUTH: 401
      # UNAUTHENTICATED — verified 1 Sep 2026 with both `User-Agent` and
      # `user-agent` spellings, while the same request from curl with that UA
      # answers 200.
      # Hence the loopback hop: ~/.dsh/agentrouter-proxy/agentrouter-proxy.mjs
      # rewrites that one header and pipes everything else through untouched. The
      # installer starts it at login, so this route needs no attention.
      # Custom provider names inherit NOTHING from pi-ai's builtin catalog, so
      # every model must spell out contextWindow/maxTokens/reasoningEfforts or
      # it silently falls back to 262144 ctx / 32768 out with no thinking level.
      # Metadata below verified live against the bridge on 25 Aug 2026:
      # 450k input tokens accepted on all four routes; max_tokens 384000 is
      # rejected only by the Claude routes (128000 cap); the upstream is
      # adaptive-thinking Opus, so thinking blocks come back even for
      # thinking.type=disabled, and the valueless `"off":` level exists only to
      # offer "no thinking" in the picker (the router accepts either shape).
      models:
        - id: claude-opus-5
          name: Claude Opus 5
          contextWindow: 1000000
          maxTokens: 128000
          input: [ text, image ]
          reasoningEfforts:
            "off":
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsTemperature: false
        - id: claude-opus-4-8
          name: Claude Opus 4.8
          contextWindow: 1000000
          maxTokens: 128000
          input: [ text, image ]
          reasoningEfforts:
            "off":
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsTemperature: false
        - id: gpt-5.6-sol
          name: GPT 5.6 Sol
          contextWindow: 1000000
          maxTokens: 128000
          input: [ text, image ]
          # The bridge translates Anthropic requests to the Responses API but
          # never surfaces reasoning blocks, so no thinking level is offered.
          reasoningEfforts: false
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
          input: [ text ]
          reasoningEfforts:
            "off":
            high: high
            max: max
        # Added 28 Aug 2026 after GET /v1/models showed a 5th upstream route.
        # Verified live: max_tokens hard-capped at 131072 ("限制数值范围[1,131072]"),
        # 400k-word input accepted, base64 image blocks accepted, temperature
        # accepted, and thinking blocks come back even for thinking.type=disabled.
        # Usage accounting is unreliable on this route (input_tokens reported as
        # 2 and 18 for 150k/400k-word prompts), so the context meter under-counts.
        - id: glm-5.3
          name: GLM 5.3
          contextWindow: 1000000
          maxTokens: 131072
          input: [ text, image ]
          reasoningEfforts:
            "off":
            high: high
            max: max
          compat:
            forceAdaptiveThinking: true

#if OMNIROUTE_BASE_URL
    omni-free:
      displayName: Others · Free real APIs via OmniRoute
      apiKeyEnv: OMNIROUTER_API_KEY
      api: openai-completions
      baseURL: {{OMNIROUTE_BASE_URL}}
      # Added 28 Aug 2026 for "true connection direct to llm": unlike the `qwen`
      # / `qwen-omni` routes (browser session + prompt-emulated tool calls),
      # every model below is a REAL provider API reached through the existing
      # OmniRoute key — so NATIVE function calling, no Chromium, no signature to
      # refresh, no per-day web cap. All eight were verified live returning a
      # proper `tool_calls` payload (get_weather) with these latencies:
      #   north-mini-code 1.5s · nemotron-3-super 2.1s · nemotron-3-ultra 3.0s
      #   hy3 3.0s · gemma-4-31b 3.6s · openrouter/free 4.7s · laguna-s 5.2s
      #   oc/nemotron-3-ultra 8.1s
      # Free tiers are rate-limited upstream: a 429 "reset after Ns" or an
      # occasional timeout is the provider throttling, not a broken route.
      # Rejected in testing: z-ai/glm-5.2:free (429/timeout), inkling:free (403,
      # agentic plans only), oc/mimo-v2.5-free + oc/north-mini-code-free
