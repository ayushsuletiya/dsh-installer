#if OMNIROUTE_BASE_URL
    antigravity:
      displayName: Antigravity · via OmniRoute
      apiKeyEnv: OMNIROUTER_API_KEY
      api: openai-completions
      baseURL: {{OMNIROUTE_BASE_URL}}
      # REWIRED 31 Aug 2026 — pure API key, NATIVE tool calling.
      #
      # Ayush connected both Antigravity accounts inside OmniRoute
      # (Providers -> Antigravity, "2 connections", both connected), so the
      # gateway now talks straight to Google's Code Assist backend
      # (daily-cloudcode-pa.googleapis.com/v1internal:streamGenerateContent)
      # on his PAID Antigravity subscription. One OMNIROUTER_API_KEY reaches it
      # from any machine or client, exactly like the codex route.
      #
      # The old `agy` CLI bridge on 127.0.0.1:3085 (~/antigravity-bridge) was
      # REMOVED 1 Sep 2026 — it could not emit tool_calls at
      # all and billed ~17.3k input tokens per call for the CLI's own agent
      # system prompt. Nothing in DSH points at that bridge any more.
      #
      # VERIFIED LIVE 31 Aug 2026 on every model below:
      #   - real OpenAI tool_calls payload, finish_reason=tool_calls
      #   - full round trip: assistant tool_calls -> role:tool -> final answer
      #   - 1.5-5s to first response, no CLI startup penalty
      #
      # The gateway always answers as an SSE stream even when stream is false.
      # DSH handles that; a raw curl must parse `data:` lines or it sees
      # "Unexpected token 'd'".
      #
      # Image input WORKS (verified 1 Sep 2026 on OmniRoute 3.8.50); every model
      # here except gpt-oss-120b-medium declares `input: [ text, image ]`.
      # antigravity/gemini-3.1-flash-image
      # (400)", so no model here declares image. antigravity/gemini-3.1-flash-image
      # is image-GENERATION and is refused for chat, so it is not registered.
      #
      # Context, measured with a 173k-token probe: Gemini accepted a 108k
      # prompt, Claude 162k, and gpt-oss-120b hard-refused above 131k — so
      # gpt-oss cannot carry a full ~166k DSH turn. Prefer Gemini or Claude.
      #
      # The Gemini High/Medium/Low ids are the app's OWN distinct models, so
      # each is listed separately. The two Claude entries instead take a real
      # reasoning_effort parameter, verified accepted by the gateway.
      # Image input: VERIFIED working 1 Sep 2026 on OmniRoute 3.8.50 — every model
      # below read a test PNG correctly (left half red, right half blue). It was
      # text-only under 3.8.49, which is why these said `input: [ text ]` and DSH
      # refused attachments with "current model does not support images".
      # gpt-oss-120b-medium is the one exception: it 502s on an image part.
      models:
        - id: antigravity/claude-opus-4-6-thinking
          name: Claude Opus 4.6 Thinking
