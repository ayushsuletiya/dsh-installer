agent-default-model:
  # The route a NEW session starts on. It must name a provider that actually
  # exists in this file, or the composer shows "Select model" with nothing chosen
  # and every new chat is dead until one is picked by hand — which is what
  # happened when the modlens mirror was switched off and `modlens-nvidia-nim`
  # stopped existing.
  #
  # So this is gated exactly like the providers above: Claude Opus 5 Thinking when
  # the TabiToken gateway is configured, Gemini 3.7 Flash when only OmniRoute is,
  # and the local Qwen bridge as the last resort. The bridge always exists, but its
  # tool calling is prompt-emulated, so switch a tool-heavy session to a real route.
#if TABITOKEN_BASE_URL
  provider: tabitoken
  model: claude-opus-5-thinking
#endif
#ifnot TABITOKEN_BASE_URL
#if OMNIROUTE_BASE_URL
  provider: antigravity
  model: antigravity/gemini-3.7-flash-high
#endif
#ifnot OMNIROUTE_BASE_URL
  provider: qwen
  model: qwen3.8-max
#endif
#endif
agent-presets:
  # Every NEW session starts on the Opus+Qwen preset (~/.dsh/.agent-presets/
  # opus-qwen): the model above stays the main agent and gets qwen_code /
  # qwen_image / subagent_qwen on top. Hot-reloaded — a new chat picks it up
  # without a restart, and sessions already running keep the preset they were
  # composed with. Same as Settings → "Set as default"; revert with `standard`.
  default: opus-qwen
pet:
  visible: false
  size: 160
  right: 24
  bottom: 120
  petId: whale-girl
ui-theme:
  preference: dark
