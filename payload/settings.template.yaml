    nvidia-nim:
      displayName: NVIDIA NIM
      apiKeyEnv: NVIDIA_NIM_API_KEY
      api: openai-completions
      baseURL: https://integrate.api.nvidia.com/v1
      # NVIDIA's free tier answers 429 when a big model's shared capacity is
      # busy — Kimi K3 did it on a full DSH turn. The default policy burns five
      # retries in ~8s, which is far too fast for a rate limit (the account is
      # capped at 40 requests/minute anyway), so the turn fails instead of
      # waiting. Back off in seconds, not milliseconds.
      retryPolicy:
        mode: normal
        maxRetries: 5
        retryableCodes: [ RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, EMPTY_RESPONSE ]
        backoff:
          initialDelayMs: 4000
          maxDelayMs: 45000
          jitterRatio: 0.2
      # Added 28 Aug 2026 from Ayush's own build.nvidia.com key. Real provider API
      # with NATIVE function calling — every model below was verified live
      # returning a proper tool_calls payload. Account limit 40 requests/minute,
      # no per-day cap, no billing.
      #
      # CONTEXT FLOOR: one DSH turn is ~166k tokens (system prompt + memory files
      # + skill catalogue + ~128 tool schemas). NVIDIA's server subtracts the
      # prompt from the window itself and answers
      #   400 "max_tokens must be at least 1, got -34788"
      # when it does not fit — not a DSH bug. Every model here was therefore also
      # sent a 170k-token prompt WITH tools attached; the ones marked `131k ctx`
      # in their display name failed that test and can only be used for small
      # prompts and subagents. Big-window models were pushed further: minimax-m3
      # held 216,827 tokens and mistral-nemotron 216,675; nemotron-3-super and
      # nemotron-3-nano swallowed 240k.
      #
      # Surveyed 27 more models on this key; NOT added because they are unusable:
      #   404 not enabled for this account — the whole llama-3.1-nemotron family
      #   (51b/70b/ultra-253b), nemotron-4-340b, nemotron-nano-3-30b,
      #   mistral-large-2, codestral-22b, gemma-3-12b, jamba-1.5-large,
      #   phi-3.5-moe, dbrx, yi-large, palmyra-creative, kimi-k2.6,
      #   cosmos-reason2-8b, zamba2-7b
      #   never answered in 50s — gemma-4-31b-it, deepseek-v4-flash-0731,
      #   nemotron-3.5-lightning-30b-a3b, llama-3.2-90b-vision
      #   answers but ignores tools — ising-calibration-1.5-31b
      #   tool call fine, breaks on a big prompt — muse-glimmer-30b
      #   endpoint saturated at test time (retry later) — poolside/laguna-xs-2.1
      #
      # TOOL-USE QUALITY (second pass, agent-style system prompt + tool_choice
      # auto, which is what DSH actually sends): the nemotron family, kimi-k3 and
      # deepseek-v4-pro call the tool on the first ask. mistral-nemotron REFUSES
      # on auto ("I'm not able to access local files") and only complies when
      # tool_choice is forced to required — hence the warning in its name; treat it
      # as chat-grade. minimax-m3 obeys auto (638ms) but returned empty content
      # under required. Latency on first call: mistral-nemotron 0.45s ·
      # nemotron-3-super 1.1s · nemotron-3-nano 1.2s · minimax-m3 1.0s ·
      # nano-omni 2.0s · gpt-oss-20b 1.2s · gpt-oss-120b 0.7s ·
      # nemotron-3-ultra 27s · kimi-k3 48s · deepseek-v4-pro 94s.
      models:
        - id: nvidia/nemotron-3-super-120b-a12b
          name: Nemotron 3 Super 120B
          contextWindow: 262144
          maxTokens: 65536
          input: [ text ]
          reasoningEfforts: false
