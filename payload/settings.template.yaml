      # the bridge ignores the Authorization header entirely.
      apiKeyEnv: QWEN_BRIDGE_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:3083/v1
      # Added 28 Aug 2026. Runs through the Qwen DESKTOP APP: ~/qwen-bridge/
      # server-app.mjs drives the app's own chat.qwen.ai page over CDP
      # (port 9222), so requests carry Ayush's logged-in session and Alibaba's
      # per-request bx-ua signature is computed by their own SDK. No API key and
      # no billing. The app must be running; the bridge relaunches it with the
      # debugging flag when the port is dead.
      # Route limits: text only (no image upload). TOOL CALLING IS NATIVE since
      # 29 Aug 2026: the web backend's own function-calling protocol is used, so
      # the bridge sends the tool list as feature_config.local_mcp, reads the
      # model's `local_tool` phase (extra.local_mcp = [{tool_name, params}]) and
      # hands DSH real tool_calls; results go back as a role:"function" turn.
