# Build the Windows harness on Windows, and prove it installs before anyone
# downloads it.
#
# Two jobs on purpose. Building the payload takes ~28 minutes (a real npm install of
# dsh plus every plugin bundle); the installer around it is seconds. Keeping them in
# one job meant every installer bug cost a full rebuild, so the payload is built once
# and published as an artifact, and the install test is a separate fast job that
# pulls it. Re-running only the failed job is then a ~4 minute loop.
#
# The point of all of it: six Windows releases went out green and dead because the
# only Windows machine in the loop was the user's.
name: Windows payload

on:
  workflow_dispatch:
    inputs:
      version:
        description: Payload version (also the release tag)
        required: true
        default: 3.0.0
      dsh_version:
        description: "@deepseek-ai/dsh version to bake in"
        required: true
        default: 0.1.1-rc.2
      publish:
        description: Attach the zip to a GitHub release
        type: boolean
        default: true
      reuse_run:
        description: "Reuse the payload from this run id (skips the 28-minute build)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - win/**
      - payload/**
      - tools/**
      - .github/workflows/windows-payload.yml

permissions:
  contents: write # only to attach the payload to a release

env:
  VERSION: ${{ github.event.inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
  DSH_VERSION: ${{ github.event.inputs.dsh_version || '0.1.1-rc.2' }}

jobs:
  # ── the slow half ───────────────────────────────────────────────────────────
  payload:
    # Skipped when a previous run's artifact is being reused, which turns iteration on
    # the installer from half an hour into about five minutes.
    if: ${{ github.event.inputs.reuse_run == '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        shell: pwsh
        run: |
          "pwsh    $($PSVersionTable.PSVersion)"
          "go      $(go version)"
          "node    $(node --version)"
          "git     $(git --version)"

      # Includes the smoke test that loads the UI and walks every plugin bundle the
      # browser would fetch, so a payload that cannot serve never gets packaged.
      - name: Build the payload
        timeout-minutes: 45
        shell: pwsh
        run: ./win/build-payload.ps1 -Version $env:VERSION -DshVersion $env:DSH_VERSION

      - name: Build the installer
        shell: pwsh
        run: |
          Push-Location win/installer
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go vet ./...
          go build -trimpath -ldflags "-H windowsgui -s -w" -o ../../dist/DeepSeekHarness-Setup.exe .
          Pop-Location
          $exe = Resolve-Path dist/DeepSeekHarness-Setup.exe
          "installer: $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"
          # An unstamped slot must be present, or get.xovi.pro cannot personalise it.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($slot in @('DSHBASE=00000000', 'DSHTOKEN=00000000')) {
            if ($text.IndexOf($slot) -lt 0) { throw "missing unstamped slot $slot" }
          }
          "both stamp slots present"

      # Uploaded BEFORE anything is tested: a failing test must still leave the
      # 28-minute artifact behind, or the next attempt pays for it all over again.
      - name: Upload the payload
        uses: actions/upload-artifact@v4
        with:
          name: windows-payload
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/DeepSeekHarness-Setup.exe
            dist/DeepSeekHarness-win-x64-*.zip
            dist/DeepSeekHarness-win-x64-*.zip.sha256

  # ── the fast half ───────────────────────────────────────────────────────────
  install:
    runs-on: windows-latest
    needs: payload
    if: ${{ always() && (needs.payload.result == 'success' || needs.payload.result == 'skipped') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: dist
          run-id: ${{ github.event.inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: The window must not crash
        timeout-minutes: 3
        shell: pwsh
        run: |
          # Proves the Win32 path (CreateWindowEx, the progress bar, the message
          # pump) runs on a real desktop rather than only compiling. Modal dialogs are
          # suppressed in this mode; one that was not cost a whole cancelled run.
          $p = Start-Process dist/DeepSeekHarness-Setup.exe -ArgumentList '--selftest-ui' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the UI self test exited $($p.ExitCode)" }
          "window ok"

      - name: Install end to end
        timeout-minutes: 22
        shell: pwsh
        run: |
          # Continue, not Stop: this step's whole job is to finish and explain itself.
          # A terminating error here once dropped pwsh into its debugger and sat at a
          # prompt until the step timed out, hiding the very log that mattered.
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:RUNNER_TEMP 'dsh-e2e'
          $zip  = (Get-ChildItem dist/DeepSeekHarness-win-x64-*.zip | Select-Object -First 1).FullName
          $sha  = (Get-Content "$zip.sha256").Trim()

          $svc = Start-Process node -ArgumentList @('win/ci-fake-service.mjs', $zip, $sha, '8799') -PassThru
          foreach ($i in 1..20) {
            Start-Sleep -Milliseconds 500
            try { Invoke-WebRequest http://127.0.0.1:8799/manifest.json -UseBasicParsing | Out-Null; break } catch {}
          }

          # Stamp the identity in, exactly as get.xovi.pro does when it serves the
          # file, and then install with no --base/--token. Passing them as flags
          # instead would leave the stamped path - the one every real download takes,
          # and the one the scheduled task depends on - untested.
          $setup = Join-Path $env:RUNNER_TEMP 'DeepSeekHarness-Setup-stamped.exe'
          node win/stamp.mjs dist/DeepSeekHarness-Setup.exe $setup 'http://127.0.0.1:8799' 'citoken0'
          if ($LASTEXITCODE -ne 0) { throw 'could not stamp the installer' }

          # -PassThru + WaitForExit, never -Wait: -Wait also waits on the process's
          # descendants, and this installer deliberately leaves a long-lived
          # background service behind. Build four installed perfectly, printed
          # "Ready", and then sat here until the step timed out.
          $p = Start-Process $setup -PassThru -NoNewWindow -ArgumentList @(
            '--silent', '--verbose', '--root', $root
          )
          if (-not $p.WaitForExit(900000)) {
            "the installer did not exit within 15 minutes"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          $installExit = $p.ExitCode
          ""
          "installer exit code: $installExit"

          $dshHome = Join-Path $root 'home\.dsh'
          function Dump($label, $path, $tail) {
            ""
            "--- $label ---"
            if (Test-Path -LiteralPath $path) {
              Get-Content -LiteralPath $path -Tail $tail -ErrorAction SilentlyContinue
            } else { "(no $path)" }
          }
          Dump 'harness.log'     (Join-Path $dshHome 'logs\harness.log') 120
          Dump 'qwen-bridge.log' (Join-Path $dshHome 'logs\qwen-bridge.log') 40
          ""
          "--- installed tree ---"
          foreach ($rel in @('runtime\node\node.exe', 'app\node_modules\@deepseek-ai\dsh\lib\bin.js',
                             'bootstrap.mjs', 'version.txt', 'installer\payload',
                             'baked\profiles\web\package.json', 'home\.dsh\settings.yaml')) {
            $state = 'MISSING'
            if (Test-Path -LiteralPath (Join-Path $root $rel)) { $state = 'present' }
            "{0,-52} {1}" -f $rel, $state
          }
          ""
          "--- scheduled task ---"
          schtasks /Query /TN "DeepSeek Harness" /FO LIST 2>&1 | Select-Object -First 6

          # When the service path fails, find out whether the harness itself is fine by
          # running it in the foreground. That one fact separates "my plumbing is
          # wrong" from "the payload is broken", and saves a whole guessing round.
          if ($installExit -ne 0) {
            ""
            "--- foreground attempt (classifies the failure) ---"
            $env:DSH_HOME = $dshHome
            $env:DSH_NO_QWEN_BRIDGE = '1'
            $fgOut = Join-Path $env:RUNNER_TEMP 'fg.out.log'
            $fgErr = Join-Path $env:RUNNER_TEMP 'fg.err.log'
            $fg = Start-Process (Join-Path $root 'runtime\node\node.exe') `
              -ArgumentList @((Join-Path $root 'bootstrap.mjs'), '--no-supervise') `
              -WorkingDirectory $root -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput $fgOut -RedirectStandardError $fgErr
            $up = $false
            foreach ($i in 1..45) {
              Start-Sleep -Seconds 2
              try { Invoke-WebRequest http://127.0.0.1:3080 -TimeoutSec 2 -UseBasicParsing | Out-Null; $up = $true; break } catch {}
            }
            if ($up) { "VERDICT: the harness SERVES in the foreground - the fault is in the service plumbing" }
            else     { "VERDICT: the harness does NOT serve in the foreground either - the fault is in the payload" }
            Dump 'foreground stdout' $fgOut 40
            Dump 'foreground stderr' $fgErr 40
            if ($fg -and -not $fg.HasExited) { Stop-Process -Id $fg.Id -Force -ErrorAction SilentlyContinue }
          }

          if ($installExit -eq 0) {
            # It reported success; now check what a browser would actually get.
            node tools/verify-web.mjs --port 3080 --timeout 60
            if ($LASTEXITCODE -ne 0) { $installExit = $LASTEXITCODE; "verify-web failed" }
            else { "installed and serving from $root" }
          }

          & dist/DeepSeekHarness-Setup.exe --uninstall --silent --root $root 2>&1 | Out-Host
          if ($svc -and -not $svc.HasExited) { Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue }
          if ($installExit -ne 0) { exit 1 }

  # ── publish ─────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [payload, install]
    if: ${{ always() && needs.install.result == 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: dist
          run-id: ${{ github.event.inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          zip=$(ls dist/DeepSeekHarness-win-x64-*.zip | head -1)
          sha=$(cat "$zip.sha256")
          bytes=$(stat -c%s "$zip")
          tag="win-$VERSION"
          gh release create "$tag" "$zip" "$zip.sha256" dist/DeepSeekHarness-Setup.exe \
            --repo "$REPO" \
            --title "Windows payload $VERSION" \
            --notes "Built and smoke-tested on windows-latest. sha256 \`$sha\`" \
            --latest=false
          url="https://github.com/$REPO/releases/download/$tag/$(basename "$zip")"
          {
            echo "### Windows payload \`$VERSION\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| zip | \`$url\` |"
            echo "| sha256 | \`$sha\` |"
            echo "| bytes | $bytes |"
            echo
            echo "Publish to get.xovi.pro:"
            echo
            echo "    dsh-publish --windows $VERSION $url $sha $bytes"
          } >> "$GITHUB_STEP_SUMMARY"
